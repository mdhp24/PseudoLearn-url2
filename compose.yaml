services:
    app:
        build:
            context: '.'
            dockerfile: './docker/Dockerfile'
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5-java/app'
        container_name: pseudolearn-water-app
        depends_on:
            - db
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            APP_ENV: '${APP_ENV:-local}'
            APP_KEY: '${APP_KEY}'
            APP_URL: '${APP_URL:-http://localhost:8000}'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE:-pseudolearn_water}'
            DB_USERNAME: '${DB_USERNAME:-root}'
            DB_PASSWORD: '${DB_PASSWORD:-ascii}'
        ports:
            - '8000:8000'
        volumes:
            - '.:/var/www/html'
        command: >
            sh -c "php artisan serve --host=0.0.0.0 --port=8000"
        networks:
            - sail

    db:
        image: 'mysql:8.0'
        container_name: pseudolearn-water-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-ascii}'
            MYSQL_DATABASE: '${MYSQL_DATABASE:-pseudolearn_water}'
        ports:
            - '3306:3306'
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - sail

    phpmyadmin:
        image: 'phpmyadmin/phpmyadmin:latest'
        container_name: pseudolearn-water-phpmyadmin
        depends_on:
            - db
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-ascii}'
        ports:
            - '8080:80'
        networks:
            - sail

    tunnel:
        image: 'cloudflare/cloudflared:latest'
        container_name: pseudolearn-water-tunnel
        depends_on:
            - app
        environment:
            TUNNEL_TOKEN: '${TUNNEL_TOKEN}'
        command: tunnel --no-autoupdate run
        networks:
            - sail

volumes:
    db-data:
        driver: local

networks:
    sail:
        driver: bridge
